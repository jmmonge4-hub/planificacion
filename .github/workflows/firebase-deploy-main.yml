# Despliega Hosting en el sitio planificacion-1818-e8523 (proyecto Firebase padel-gestor)
# en cada push a main. El sitio se indica en firebase.json.
name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase-deploy
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANIFICACION }}
          channelId: live
          projectId: padel-gestor
          # firebase-tools 15.35 exige un permiso extra (serviceusage) que la cuenta de servicio no tiene
          firebaseToolsVersion: 15.34.0
