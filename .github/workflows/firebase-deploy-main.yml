# Despliega Hosting en planificacion-1818-e8523 en cada push a main.
# Los datos siguen en el Firestore de padel-gestor (configurado en public/index.html).
name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: firebase-deploy
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLANIFICACION }}
          channelId: live
          projectId: planificacion-1818-e8523
